<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国星空 · 仰望苍穹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
      color: #e8e0d0;
    }

    /* 深邃夜空背景 */
    .sky {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at bottom, #1a1a40 0%, #0a0a1f 40%, #000010 100%);
      z-index: 0;
    }

    /* 银河光带 */
    .milky-way {
      position: absolute;
      width: 160%;
      height: 40%;
      top: 20%;
      left: -30%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(180, 190, 255, 0.03) 20%,
        rgba(200, 210, 255, 0.08) 40%,
        rgba(220, 225, 255, 0.12) 50%,
        rgba(200, 210, 255, 0.08) 60%,
        rgba(180, 190, 255, 0.03) 80%,
        transparent 100%
      );
      transform: rotate(-15deg);
      filter: blur(20px);
      pointer-events: none;
      animation: milky-drift 120s linear infinite;
    }

    @keyframes milky-drift {
      0% { transform: rotate(-15deg) translateX(0); }
      50% { transform: rotate(-15deg) translateX(5%); }
      100% { transform: rotate(-15deg) translateX(0); }
    }

    /* 星星画布 */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* 月亮 */
    .moon {
      position: absolute;
      top: 12%;
      right: 15%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e7, #f0e6c8 40%, #d4c4a0 70%, #b8a070 100%);
      box-shadow:
        0 0 40px rgba(255, 240, 200, 0.4),
        0 0 80px rgba(255, 230, 180, 0.2),
        0 0 120px rgba(255, 220, 150, 0.1),
        inset -15px -10px 30px rgba(0, 0, 0, 0.15);
      z-index: 2;
      animation: moon-glow 8s ease-in-out infinite;
    }

    .moon::before {
      content: '';
      position: absolute;
      top: 18%;
      left: 22%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(180, 160, 120, 0.25);
      box-shadow:
        28px 22px 0 -4px rgba(160, 140, 100, 0.2),
        12px 40px 0 -6px rgba(150, 130, 90, 0.18),
        40px 8px 0 -5px rgba(170, 150, 110, 0.15);
    }

    @keyframes moon-glow {
      0%, 100% { box-shadow: 0 0 40px rgba(255, 240, 200, 0.4), 0 0 80px rgba(255, 230, 180, 0.2), 0 0 120px rgba(255, 220, 150, 0.1); }
      50% { box-shadow: 0 0 50px rgba(255, 240, 200, 0.55), 0 0 100px rgba(255, 230, 180, 0.3), 0 0 150px rgba(255, 220, 150, 0.15); }
    }

    /* 诗意文字区域 */
    .poetry {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      animation: fade-in 3s ease 1.5s forwards;
    }

    .poetry h1 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.3em;
      color: #f5e6c8;
      text-shadow: 0 0 20px rgba(255, 220, 150, 0.3);
      margin-bottom: 0.6em;
    }

    .poetry p {
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: rgba(230, 220, 200, 0.75);
      line-height: 1.9;
    }

    .poetry .author {
      margin-top: 1.2em;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: rgba(200, 185, 160, 0.55);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* 控制提示 */
    .hint {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: rgba(180, 170, 150, 0.35);
      z-index: 10;
      opacity: 0;
      animation: fade-in 2s ease 4s forwards;
    }

    /* 流星 */
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
      opacity: 0;
      z-index: 3;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
      transform-origin: left center;
      transform: rotate(45deg) translateX(-80px);
    }

    /* 响应式微调 */
    @media (max-width: 600px) {
      .moon {
        width: 60px;
        height: 60px;
        top: 10%;
        right: 10%;
      }
      .poetry h1 {
        letter-spacing: 0.15em;
      }
      .poetry p {
        letter-spacing: 0.12em;
      }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="milky-way"></div>
    <div class="moon"></div>
  </div>

  <canvas id="stars"></canvas>

  <div class="poetry">
    <h1>星空</h1>
    <p>天阶夜色凉如水<br>卧看牵牛织女星</p>
    <div class="author">—— 杜牧 ·《秋夕》</div>
  </div>

  <div class="hint">点击屏幕可召唤流星 · 静候片刻可见更多流星</div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let shootingStars = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 2800);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinklePhase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.85 ? 'rgba(200, 220, 255,' : 'rgba(255, 250, 240,'
        });
      }
    }

    function drawStars(time) {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(star => {
        const twinkle = Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.35 + 0.65;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color + (star.alpha * twinkle) + ')';
        ctx.fill();

        // 偶尔给大一点的星加点光晕
        if (star.radius > 1.1) {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius * 3, 0, Math.PI * 2);
          ctx.fillStyle = star.color + (0.08 * twinkle) + ')';
          ctx.fill();
        }
      });
    }

    // 流星类
    class ShootingStar {
      constructor(manual = false) {
        this.reset(manual);
      }

      reset(manual = false) {
        this.x = Math.random() * width * 0.8;
        this.y = Math.random() * height * 0.4;
        this.len = Math.random() * 80 + 50;
        this.speed = Math.random() * 8 + 6;
        this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
        this.alpha = 0;
        this.life = 0;
        this.maxLife = manual ? 60 : Math.random() * 40 + 40;
        this.active = true;
      }

      update() {
        this.life++;
        if (this.life < 10) {
          this.alpha = this.life / 10;
        } else if (this.life > this.maxLife - 15) {
          this.alpha = (this.maxLife - this.life) / 15;
        } else {
          this.alpha = 1;
        }

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        if (this.life >= this.maxLife || this.x > width + 100 || this.y > height + 100) {
          this.active = false;
        }
      }

      draw() {
        if (!this.active) return;
        const tailX = this.x - Math.cos(this.angle) * this.len;
        const tailY = this.y - Math.sin(this.angle) * this.len;

        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
        gradient.addColorStop(0.3, `rgba(220, 230, 255, ${this.alpha * 0.6})`);
        gradient.addColorStop(1, 'rgba(200, 210, 255, 0)');

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 头部亮点
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.fill();
      }
    }

    function spawnShootingStar(manual = false) {
      shootingStars.push(new ShootingStar(manual));
    }

    // 自动偶尔生成流星
    setInterval(() => {
      if (Math.random() < 0.4) {
        spawnShootingStar(false);
      }
    }, 2800);

    // 点击生成流星
    canvas.addEventListener('click', (e) => {
      const star = new ShootingStar(true);
      star.x = e.clientX;
      star.y = e.clientY;
      star.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
      shootingStars.push(star);
    });

    let lastTime = 0;
    function animate(time) {
      drawStars(time * 0.001);

      // 更新并绘制流星
      shootingStars = shootingStars.filter(s => s.active);
      shootingStars.forEach(s => {
        s.update();
        s.draw();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
